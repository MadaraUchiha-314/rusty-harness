[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/MadaraUchiha-314/rusty-harness"
homepage = "https://madarauchiha-314.github.io/rusty-harness/"
authors = ["MadaraUchiha-314"]

[workspace.dependencies]
rusty_harness = { path = "crates/rusty-harness", version = "0.1.0", default-features = false }
gloo-timers = { version = "0.4", features = ["futures"] }
pyo3 = { version = "0.29", features = ["abi3-py310"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
pyo3-stub-gen = "0.23"
tokio = { version = "1", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"

[workspace.lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
