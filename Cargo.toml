[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
repository = "https://github.com/MadaraUchiha-314/rusty-harness"
homepage = "https://madarauchiha-314.github.io/rusty-harness/"
authors = ["MadaraUchiha-314"]

[workspace.dependencies]
# The official A2A protocol crates (protocol 1.0; crates.io names end in -lf, imported as `a2a`, `a2a_client`, `a2a_server`).
a2a-lf = "0.4.2"
a2a-client-lf = { version = "0.2.9", default-features = false }
a2a-server-lf = { version = "0.5.3", default-features = false }
# The terminal renderer (R27): ratatui 0.30 and the widgets that build on it; `ratatui-image`
# 12 is the release line that targets ratatui 0.30 (its stable 11.x targets 0.29).
ratatui = { version = "0.30.2", default-features = false, features = [
  "crossterm",
  "underline-color",
] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
tui-markdown = { version = "0.3.12", default-features = false }
ratatui-image = { version = "12.0.0-rc.3", default-features = false, features = ["crossterm"] }
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
clap = { version = "4.6", features = [
  "derive",
  "std",
  "help",
  "usage",
  "error-context",
], default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
async-trait = "0.1"
base64 = "0.22"
bytes = { version = "1", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
futures = "0.3"
getrandom = "0.4"
http = "1"
# ids: v7 for tasks, messages and events; v5 for deterministic ids (idempotency keys, outbound contextIds).
url = { version = "2", features = ["serde"] }
uuid = { version = "1.29", features = ["v4", "v5", "v7", "serde"] }
rusty_harness = { path = "crates/rusty-harness", version = "0.1.0", default-features = false }
gloo-timers = { version = "0.4", features = ["futures"] }
schemars = { version = "1", features = ["url2"] }
# The official MCP Rust SDK (R8.1); native only (Q14).
rmcp = { version = "3.7", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
# WebSockets for the Realtime voice and transcription sessions (R28.3); TLS through rustls
# with the OS roots, as reqwest.
# Microphone and speaker on the native host (R27.5, R28.6), behind `audio`.
cpal = { version = "0.18", default-features = false }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
  "connect",
  "handshake",
  "rustls-tls-native-roots",
] }
opentelemetry = { version = "0.33", features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = [
  "trace",
  "http-proto",
  "reqwest-blocking-client",
  "reqwest-rustls",
] }
opentelemetry-proto = { version = "0.33", default-features = false, features = [
  "gen-tonic-messages",
  "trace",
] }
prost = "0.14"
opentelemetry_sdk = { version = "0.33", features = ["trace", "rt-tokio"] }
pyo3 = { version = "0.29", features = ["abi3-py310"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
pyo3-stub-gen = "0.23"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false }
toml = "1"
# The official Temporal Rust SDK (R22.1); native only, behind `durable-temporal`.
temporalio-sdk = { version = "1.1", default-features = false, features = ["envconfig"] }
temporalio-client = { version = "1.1", default-features = false, features = [
  "envconfig",
  "tls-ring",
] }
temporalio-common = { version = "1.1", default-features = false }
temporalio-macros = { version = "1.1" }
temporalio-workflow = { version = "1.1", default-features = false }
# Compiles the protos in-process (protox) so no `protoc` is needed on a builder or in CI.
temporalio-protos = { version = "0.10", default-features = false, features = ["vendored-protox"] }
tracing = "0.1"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "registry",
  "std",
  "fmt",
  "env-filter",
  "json",
] }
wasm-bindgen = "0.2"
web-time = "1"
jsonschema = { version = "0.60", default-features = false }
criterion = { version = "0.8", default-features = false, features = [
  "async_tokio",
  "cargo_bench_support",
] }
js-sys = "0.3"
web-sys = "0.3"
zeroize = "1"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"

[workspace.lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# The shipped `rusty-harness` binary (npm, PyPI, the GitHub release): under the 25 MB
# budget (T7, decision-006). `release` stays as it is for benchmarks and dependants.
[profile.dist]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
