[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[project]
name = "rusty_harness"
description = "A tiny agent harness that's blazing fast."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dynamic = ["version"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: Implementation :: CPython",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://madarauchiha-314.github.io/rusty-harness/"
Repository = "https://github.com/MadaraUchiha-314/rusty-harness"

[dependency-groups]
dev = ["maturin>=1,<2", "pyright>=1.1", "pytest>=8", "pytest-asyncio>=1", "ruff>=0.8"]

[tool.maturin]
module-name = "rusty_harness"
bindings = "pyo3"
features = ["pyo3/extension-module"]

[tool.uv]
# The extension is built and installed by `maturin develop`, not by `uv sync`.
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
# Generated by `cargo run --bin stub_gen`; CI checks it is up to date instead.
extend-exclude = ["rusty_harness.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PYI", "PT", "RUF"]

[tool.pyright]
include = ["rusty_harness.pyi", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
