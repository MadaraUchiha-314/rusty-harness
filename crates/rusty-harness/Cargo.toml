[package]
name = "rusty_harness"
description = "A tiny agent harness that's blazing fast."
readme = "README.md"
keywords = ["agent", "harness", "llm", "async"]
categories = ["asynchronous", "development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
default = []
# Native runtime: `tokio` enters the dependency tree only through this feature.
rt-tokio = [
  "dep:tokio",
  "tokio/rt",
  "tokio/time",
  "tokio/fs",
  "tokio/process",
  "tokio/io-util",
  "dep:reqwest",
  "dep:tokio-tungstenite",
  "dep:a2a-client-lf",
  "dep:getrandom",
  "dep:tracing-opentelemetry",
  "dep:opentelemetry",
  "dep:opentelemetry-otlp",
  "dep:opentelemetry_sdk",
]
# Browser / JS runtime: `spawn_local` and JS timers. Only compiled for wasm32.
rt-wasm = ["dep:wasm-bindgen-futures", "dep:gloo-timers"]
# The feature table of docs/specs/issue-3/design.md § Cargo features. Each feature gains
# its dependencies in the milestone that implements it; an empty feature is a declared
# seam, not a capability.
# The A2A server, the inbox route and the HTTP bindings (native only).
server = [
  "rt-tokio",
  "dep:a2a-server-lf",
  "dep:axum",
  "tokio/net",
  "tokio/rt-multi-thread",
  "tokio/signal",
]
# Tools over the official MCP Rust SDK (native only; the browser uses a host transport).
mcp = ["rt-tokio", "dep:rmcp"]
# Durable execution on the official Temporal Rust SDK (native only).
durable-temporal = [
  "rt-tokio",
  "dep:temporalio-sdk",
  "dep:temporalio-client",
  "dep:temporalio-common",
  "dep:temporalio-macros",
  "dep:temporalio-workflow",
  "dep:temporalio-protos",
  "tokio/rt-multi-thread",
]
# `embedded` durable mode: the SDK's ephemeral dev server (development only).
durable-embedded = ["durable-temporal", "temporalio-sdk/testing"]
# The gRPC binding of the A2A server.
a2a-grpc = ["server"]
# The terminal renderer.
tui = [
  "rt-tokio",
  "dep:ratatui",
  "dep:crossterm",
  "dep:tui-markdown",
  "dep:ratatui-image",
  "dep:image",
  "tokio/rt-multi-thread",
  "tokio/signal",
]
# Microphone and speaker host capabilities.
audio = ["rt-tokio"]
# The `rusty-harness` binary: everything a user installs.
cli = ["server", "mcp", "durable-temporal", "durable-embedded", "tui", "audio", "dep:clap"]

[dependencies]
a2a-lf = { workspace = true } # its lib name is `a2a`
a2a-client-lf = { workspace = true, optional = true } # its lib name is `a2a_client`
crossterm = { workspace = true, optional = true }
image = { workspace = true, optional = true }
ratatui = { workspace = true, optional = true }
ratatui-image = { workspace = true, optional = true }
tui-markdown = { workspace = true, optional = true }
a2a-server-lf = { workspace = true, optional = true } # its lib name is `a2a_server`
axum = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
temporalio-sdk = { workspace = true, optional = true }
temporalio-client = { workspace = true, optional = true }
temporalio-common = { workspace = true, optional = true }
temporalio-macros = { workspace = true, optional = true }
temporalio-workflow = { workspace = true, optional = true }
temporalio-protos = { workspace = true, optional = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
getrandom = { workspace = true, optional = true }
http = { workspace = true }
reqwest = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
rmcp = { workspace = true, optional = true, features = [
  "client",
  "transport-child-process",
  "transport-streamable-http-client-reqwest",
  "server",
  "transport-io",
  "macros",
] }
schemars = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
url = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
# Feature unification: `uuid/js` makes the official `a2a` types crate build for the browser
# (design.md T2, D5) — uuid needs a JS randomness source there.
uuid = { workspace = true, features = ["js"] }

# Native-only: tests and doctests run under tokio behind `rt-tokio`.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
opentelemetry-proto = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "test-util", "time"] }

# The `rusty-harness` binary (R27.1, R30.1): everything a user installs, behind `cli`.
[[bin]]
name = "rusty-harness"
path = "src/bin/rusty-harness.rs"
required-features = ["cli"]

# The stdio MCP server the tool tests talk to (testing-plan T2); built only with `mcp`.
[[bin]]
name = "echo-mcp"
path = "tests/fixtures/plugins/demo/bin/echo-mcp.rs"
required-features = ["mcp"]
test = false
doc = false
bench = false

[build-dependencies]
# build.rs reads strings/en.json to generate the StringKey constants (R33).
serde_json = { workspace = true }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[package.metadata.cargo-machete]
# `a2a-lf`'s library is named `a2a`, which machete cannot map back to the package; the
# wasm32-only `uuid` exists for feature unification (decision-003), not for direct use.
# `temporalio-workflow` is reached only through the paths the Temporal macros expand to;
# `temporalio-protos` is listed to turn on its `vendored-protox` feature (no system protoc).
ignored = ["a2a-lf", "a2a-client-lf", "a2a-server-lf", "temporalio-workflow", "temporalio-protos"]
